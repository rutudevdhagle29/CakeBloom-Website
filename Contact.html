<!DOCTYPE html>
<html>
<head>
     <title>Contact Us - CakeBloom</title>
     <link rel="stylesheet" href="contact.css">
</head>
<body>
<div class="contact-container">
    <h1>Contact Us</h1>
    <p class="subtitle">
        We'd love to hear from you!
        Get in touch with CakeBloom.
    </p>
    <div class="contact-box">
        <div class="contact-info">
            <h2>Get In Touch</h2>

            <p> <b>Address:</b> Pune, Maharashtra</p>
            <p> <b>Phone</b> + 98765 43210</p>
            <p> <b>Email</b> cakebloom@gmail.com</p>
            <p> <b>Timing</b> 10:00 AM - 9:00 PM</p>
        </div>
    <div class="contact.form">
        <h2>Send us a Message</h2>
    
    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email"><br><br>

        <label>Phone:</label>
        <input type="tel" placeholder="Enter your phone number"><br><br>

        <label>Message:</label>
        <textarea placeholder="Write your message"></textarea><br><br>

        <button type="submit">Send Message</button><br><br>
    </form>
      </div>
   </div>
</div>

</body>
</html>
