<!DOCTYPE html>
<html>
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width,
initial-scale=1.0">
     <title>Contact Us - CakeBloom</title>
     <link rel="stylesheet" href="Contact.css">
</head>
<body>
<div class="contact-page">
    <h1>Contact Us</h1>
<p class="intro">
    We'd love to hear from you! Get in touch with CakeBloom.
</p>
    <div class="contact-container">
        <div class="contact-info">
            <h2>Get In Touch</h2>
           
        <div class="info-box">
             <h3>Address</h3>
             <p>Pune, Maharashtra</p>
        </div>
        
        <div class="info-box">
             <h3>Phone</h3>
             <p>91 98765 43210</p>
        </div>
    
        <div class="info-box">
             <h3>Email</h3>
             <p>cakebloom@gmail.com</p>
        </div>
   
        <div class="info-box">
             <h3>Timing</h3>
             <p>10:00 AM- 9:00 PM</p>
        </div>
 
       <div class="contact-form">
             <h2>Send us a Message</h2>
    <form>
            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">
         
            <label>Phone</label>
            <input type="tel" placeholder="Enter your phone number">
         
            <label>Message</label>
            <textarea placeholder="Write your message"></textarea>
           
                 <button type="submit">Send Message</button>
    
               </form>
            </div>
         </div>
      </div>
   </body>
</html>
